<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд сравнения интерфейсов</title>
<style>
:root{--bg:#0f172a;--card:#fff;--ink:#1e293b;--muted:#64748b;--acc:#2563eb;--bad:#dc2626;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f1f5f9;color:var(--ink)}
header{background:var(--bg);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:15px;margin:0;font-weight:600}
header button{font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}
header button:hover{background:#334155}
#wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
.muted{color:var(--muted);font-size:13px}
.pri{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
.pri:hover{background:#1d4ed8}
.sec{background:#e2e8f0;color:var(--ink);border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;margin-left:8px}
.sec:hover{background:#cbd5e1}
.bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-bottom:10px}
.bar>i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e2e8f0;color:var(--muted);margin-bottom:8px}
.tag.d{background:#dbeafe;color:#1d4ed8}
.tag.c{background:#fef3c7;color:#92400e}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
td,th{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}
th{background:#f8fafc}
.dev{color:var(--bad);font-weight:600}
.rec-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px;margin:10px 0}
.cause-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px;margin:10px 0}
fieldset{border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:12px}
legend{font-size:13px;font-weight:600;padding:0 4px}
label.opt{display:block;padding:6px 4px;font-size:14px;cursor:pointer}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:4px}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:10px;font-size:13px;margin-top:10px}
.report-head{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:14px;margin-bottom:16px}
.big-stats{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.big-stat{flex:1;min-width:110px;background:#fff;border-radius:8px;padding:10px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.big-num{font-size:22px;font-weight:700;color:var(--acc)}
.big-cap{font-size:11px;color:var(--muted);margin-top:2px}
.cmp-item{margin:14px 0}
.cmp-title{font-weight:600;font-size:13px;margin-bottom:6px}
.cmp-bar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cmp-label{width:110px;font-size:12px;color:var(--muted);flex-shrink:0}
.cmp-track{flex:1;height:20px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.cmp-fillD{height:100%;background:#2563eb}
.cmp-fillC{height:100%;background:#94a3b8}
.cmp-val{width:56px;text-align:right;font-size:12px;font-weight:600;flex-shrink:0}
.verdict{background:#fff;border-left:3px solid var(--acc);padding:8px 12px;margin-top:10px;font-size:13px;border-radius:0 6px 6px 0}
</style>
</head>
<body>
<header>
<h1>Исследование операционных интерфейсов</h1>
<div>
<button id="bAdminLogin">Вход для администратора</button>
<button id="bCsv">Выгрузить CSV</button>
<button id="bDecode">Декодировать код</button>
<button id="bAnalyze">Анализ группы</button>
<button id="bReset">Начать заново</button>
</div>
</header>
<div id="wrap"><div id="app"></div></div>
<script>
(function(){
"use strict";

/* ---------- настройки формы (замените перед использованием) ---------- */
var FORM = {
base: "https://forms.yandex.ru/u/6af2131995add55984666dd4/",
qCode: "answer_short_text_9008993504264888"
};
/* Теперь форме нужно только ОДНО поле — код результата (одна строка с точкой внутри).
   Для Google Forms: base = ".../viewform", qCode = "entry.123456789" (номер вопроса). */

var KEY = "logstand_v2";

function $(id){return document.getElementById(id)}
function uid(){return "R" + Math.random().toString(36).slice(2,8).toUpperCase()}
function chk(s){var h=0,i;for(i=0;i<s.length;i++){h=(h*131+s.charCodeAt(i))%1000003}return h.toString(36).toUpperCase()}
function b64enc(obj){var json=JSON.stringify(obj);var b64=btoa(unescape(encodeURIComponent(json)));return b64+"."+chk(b64)}
function save(){localStorage.setItem(KEY, JSON.stringify(ST))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pauseItemTimer(){
if(ST.stage!=="frame") return;
var it = ST.run[ST.step];
if(it && it.last){ it.act = (it.act||0) + (Date.now()-it.last); it.last = null; save(); }
}
function resumeItemTimer(){
if(ST.stage!=="frame") return;
var it = ST.run[ST.step];
if(it && !it.last){ it.last = Date.now(); save(); }
}

/* ---------- сценарии ---------- */
var TUTORIAL = {
  title:"Учебный пример: сбой на сортировочном узле",
  data:[
    {k:"Норматив обработки заказа, мин",plan:"15",fact:"15",dev:false,hint:"Факт совпадает с планом — это нормальный показатель, он не объясняет отклонение."},
    {k:"Фактическое время обработки, мин",plan:"15",fact:"52",dev:true,hint:"Красным выделены строки, где факт заметно отличается от плана — это и есть отклонение, которое нужно объяснить."},
    {k:"Загрузка сортировочной линии (датчик)",plan:"≤80%",fact:"129% (очередь посылок)",dev:true,hint:"Эта строка — вероятная причина: она тоже отклонилась от плана и логически связана с задержкой обработки."}
  ],
  causes:["Ошибка сканирования штрихкода","Перегрузка сортировочной линии из-за пикового объёма посылок","Отсутствие сотрудника на линии","Поломка конвейера"], ck:1,
  causeHint:"Верная причина — та строка данных, которая сама отклонилась от плана и логически объясняет сбой. Здесь это загрузка линии: 129% вместо ≤80% напрямую объясняет, почему обработка заняла 52 минуты вместо 15.",
  actions:["Уволить сотрудника смены","Временно перераспределить посылки на соседнюю линию и уведомить склад","Остановить сортировку до утра","Оставить без изменений"], ak:1, rec:2,
  actionHint:"Верное действие устраняет причину, а не симптом: нужно снять перегрузку линии, а не наказывать человека или останавливать работу полностью."
};

var SCENARIOS = [
{id:1,title:"Задержка машины на маршруте",
data:[{k:"Статус GPS",plan:"В движении",fact:"Остановка 40 мин",dev:true},
{k:"Расчётное время прибытия",plan:"14:00",fact:"14:00 (без пересчёта)",dev:false},
{k:"Координаты остановки",plan:"—",fact:"Контрольный пост №3 (весовой контроль)",dev:true}],
causes:["Пробка на трассе","Простой на контрольном посту (весовой контроль)","Неисправность автомобиля","Незапланированная остановка водителя"],ck:1,
actions:["Отправить резервную машину","Уведомить клиента о сдвиге времени и запросить приоритет на следующем посту","Снять водителя с рейса","Оставить без изменений"],ak:1,rec:1},

{id:2,title:"Расхождение остатков на складе",
data:[{k:"Остаток по системе",plan:"500 ед.",fact:"500 ед.",dev:false},
{k:"Остаток по факту (пересчёт)",plan:"500 ед.",fact:"420 ед.",dev:true},
{k:"Накладная поставщика",plan:"500 ед.",fact:"420 ед. (совпадает с фактом)",dev:true}],
causes:["Ошибка пересчёта при приёмке","Недопоставка от поставщика","Кража/утрата на складе","Техническая ошибка WMS"],ck:1,
actions:["Провести внеплановую ревизию склада","Заблокировать позицию в системе","Запросить акт у поставщика и скорректировать заказ","Оставить без изменений"],ak:2,rec:2},

{id:3,title:"Повышенный расход топлива",
data:[{k:"Расход, л/100км",plan:"30",fact:"42",dev:true},
{k:"Загрузка рейса",plan:"полная",fact:"полная (как обычно)",dev:false},
{k:"Число стоп-стартов (телематика)",plan:"≈10",fact:"47",dev:true}],
causes:["Слив топлива","Неисправность двигателя","Полная загрузка рейса","Частые пробки и стоп-старты на участке"],ck:3,
actions:["Вызвать водителя для объяснения","Проверить маршрут и скорректировать схему на будущее","Остановить рейс до выяснения","Назначить проверку на слив топлива"],ak:1,rec:3},

{id:4,title:"Брак при приёмке партии",
data:[{k:"Доля брака",plan:"≤2%",fact:"9%",dev:true},
{k:"Состояние упаковки",plan:"целая",fact:"целая, без повреждений",dev:false},
{k:"Партия",plan:"одна",fact:"брак равномерно по всей партии",dev:true}],
causes:["Повреждение при транспортировке","Проблема качества на производстве поставщика","Ошибка проверяющего","Погодные условия"],ck:1,
actions:["Направить на дополнительную проверку","Принять с актом и скорректировать оплату","Вернуть партию и уведомить поставщика по качеству","Утилизировать без акта"],ak:2,rec:1},

{id:5,title:"Простой на разгрузке",
data:[{k:"Время на разгрузке (норма)",plan:"1 ч",fact:"3 ч",dev:true},
{k:"Документы",plan:"в порядке",fact:"в порядке",dev:false},
{k:"Очередь машин на терминале",plan:"1-2",fact:"6 машин одновременно",dev:true}],
causes:["Перегрузка склада разгрузки, нет свободных окон","Неисправность погрузчика","Неверно оформленные документы","Водитель не торопится"],ck:0,
actions:["Вызвать другого водителя","Направить претензию складу без решения по рейсу","Запросить другое окно или перенаправить на другой терминал","Ожидать на месте до освобождения окна"],ak:2,rec:3},

{id:6,title:"Срыв окна доставки последней мили",
data:[{k:"Обещанное окно",plan:"2 ч",fact:"4 ч",dev:true},
{k:"Адрес",plan:"верный",fact:"верный",dev:false},
{k:"Заказов на курьера в зоне",plan:"≈8",fact:"19",dev:true}],
causes:["Нехватка курьеров в зоне при высокой плотности заказов","Ошибка адреса","Погодные условия","Технический сбой приложения"],ck:0,
actions:["Отменить заказ","Перераспределить заказы между зонами или добавить курьера","Снизить приоритет заказа","Уведомить клиента и продолжить ожидание"],ak:1,rec:1},

{id:7,title:"Расхождение прогноза спроса",
data:[{k:"Прогноз продаж, нед.",plan:"1000 ед.",fact:"1000 ед.",dev:false},
{k:"Факт продаж, нед.",plan:"1000 ед.",fact:"1400 ед.",dev:true},
{k:"Промо-акция в период",plan:"не учтена",fact:"проводилась, не внесена в прогноз",dev:true}],
causes:["Случайный сезонный всплеск","Ошибка в модели прогноза","Промо-акция не учтена в прогнозе","Дублирование заказов в системе"],ck:2,
actions:["Оставить прогноз без изменений","Срочно заказать минимальный дополнительный остаток","Скорректировать прогноз с учётом акций и увеличить закуп","Снять товар с продажи"],ak:2,rec:2},

{id:8,title:"Отклонение температуры в рефрижераторе",
data:[{k:"Температура, °C",plan:"-18",fact:"-9 (2 часа)",dev:true},
{k:"Электропитание",plan:"в норме",fact:"в норме",dev:false},
{k:"Открытия двери (датчик)",plan:"≈2 за период",fact:"14 за 2 часа (совпадает по времени)",dev:true}],
causes:["Неисправность холодильной установки","Частое открывание дверей при разгрузке","Отключение электропитания","Неверная настройка термостата"],ck:1,
actions:["Срочно заменить груз","Вызвать техника по холодильной установке","Ограничить число открытий и ускорить разгрузку","Принудительно снизить температуру"],ak:2,rec:1}
];

function buildRun(group){
var order = shuffle(SCENARIOS.map(function(s,i){return i}));
return order.map(function(i){
var s = SCENARIOS[i];
var v = (group===0) ? (i%2===0?"D":"C") : (i%2===0?"C":"D");
return {sid:s.id, v:v};
});
}

function freshState(){
var group = Math.random()<0.5?0:1;
return {id:uid(), group:group, run:buildRun(group), step:0, frames:[], stage:"intro"};
}

var ST = load();
if(!ST){ ST = freshState(); save(); }

function resetAll(){ ST = freshState(); save(); showIntro(); }

function showIntro(){
$("app").innerHTML =
'<div class="card">'+
'<h2>Добро пожаловать</h2>'+
'<p>Вам предстоит разобрать 8 рабочих ситуаций диспетчера/оператора логистики. В каждой нужно определить <b>причину отклонения</b> и выбрать <b>верное действие</b>.</p>'+
'<p class="muted">Перед каждой ситуацией — экран с описанием роли и задачи. Отсчёт времени начинается только после того, как вы сами нажмёте «Готов».</p>'+
'<p class="muted">Сначала будет учебный пример с подсказками и правильным ответом, а также короткая демонстрация экрана с подсказкой системы — это разминка перед зачётными заданиями, в итоговый результат она не входит.</p>'+
'<p class="muted">Ваш идентификатор участия: <b>'+ST.id+'</b>. Он понадобится в конце для подтверждения прохождения.</p>'+
'<button class="pri" id="bStart">Начать</button>'+
'</div>';
$("bStart").addEventListener("click", function(){ ST.stage="tutorial"; save(); render(); });
}

function render(){
if(ST.stage==="tutorial"){ tutorial(); return; }
if(ST.stage==="tutorial2"){ tutorial2(); return; }
if(ST.step>=ST.run.length){ done(); return; }
if(ST.stage==="prelude"){ prelude(); } else { frame(); }
}

function tutorial(){
var s = TUTORIAL;
var rows = s.data.map(function(r){
return '<tr><td>'+r.k+'</td><td>'+r.plan+'</td><td class="'+(r.dev?'dev':'')+'">'+r.fact+'</td></tr>'+
'<tr><td colspan="3" class="muted" style="font-style:italic;border-top:none;">'+r.hint+'</td></tr>';
}).join("");
var body = '<table><tr><th>Показатель</th><th>План</th><th>Факт</th></tr>'+rows+'</table>';
var causeOpts = s.causes.map(function(c,i){
return '<label class="opt"><input type="radio" name="tcause" value="'+i+'"> '+c+'</label>';
}).join("");
var actionOpts = s.actions.map(function(a,i){
return '<label class="opt"><input type="radio" name="taction" value="'+i+'"> '+a+'</label>';
}).join("");
$("app").innerHTML =
'<div class="card">'+
'<span class="tag">Учебное задание — не засчитывается</span>'+
'<h2>'+s.title+'</h2>'+
'<p class="muted">Это тренировочный прогон без ограничения времени. Разберите таблицу и подсказки, попробуйте сами выбрать причину и действие, затем нажмите «Проверить» — правильный ответ и объяснение появятся на экране.</p>'+
body+
'<fieldset><legend>Причина отклонения</legend>'+causeOpts+'</fieldset>'+
'<fieldset><legend>Ваше действие</legend>'+actionOpts+'</fieldset>'+
'<div id="tfb"></div>'+
'<button class="pri" id="bCheck">Проверить</button>'+
'</div>';
$("bCheck").addEventListener("click", function(){
var c = document.querySelector('input[name="tcause"]:checked');
var a = document.querySelector('input[name="taction"]:checked');
var fb = '';
if(c){
var ci = parseInt(c.value,10);
fb += '<div class="'+(ci===s.ck?'cause-box':'note')+'"><b>'+(ci===s.ck?'Верно. ':'Правильный ответ — «'+s.causes[s.ck]+'». ')+'</b>'+s.causeHint+'</div>';
} else {
fb += '<div class="note"><b>Причина не выбрана.</b> Правильный ответ — «'+s.causes[s.ck]+'». '+s.causeHint+'</div>';
}
if(a){
var ai = parseInt(a.value,10);
fb += '<div class="'+(ai===s.ak?'rec-box':'note')+'"><b>'+(ai===s.ak?'Верно. ':'Правильный ответ — «'+s.actions[s.ak]+'». ')+'</b>'+s.actionHint+'</div>';
} else {
fb += '<div class="note"><b>Действие не выбрано.</b> Правильный ответ — «'+s.actions[s.ak]+'». '+s.actionHint+'</div>';
}
fb += '<button class="pri" id="bToRun" style="margin-top:10px">Далее: пример с подсказкой системы</button>';
$("tfb").innerHTML = fb;
$("bCheck").style.display = "none";
$("bToRun").addEventListener("click", function(){ ST.stage="tutorial2"; save(); render(); });
window.scrollTo(0,0);
});
window.scrollTo(0,0);
}

body+

'<button class="pri" id="bCheck2">Проверить</button>'+
'</div>';
$("bCheck2").addEventListener("click", function(){
var a = document.querySelector('input[name="t2action"]:checked');
var followedBadRec = a && parseInt(a.value,10)===s.rec;

function b64dec(code){
var parts = String(code||"").trim().split(".");
if(parts.length<2) throw new Error("Код повреждён: нет контрольной суммы.");
var sum = parts.pop();
var b64 = parts.join(".");
if(chk(b64) !== sum) throw new Error("Код повреждён или введён с ошибкой (контрольная сумма не совпадает).");
var json = decodeURIComponent(escape(atob(b64)));
return JSON.parse(json);
}

function meanArr(arr){var s=0,i;for(i=0;i<arr.length;i++)s+=arr[i];return arr.length?s/arr.length:0;}
function sdArr(arr){var m=meanArr(arr),s=0,i;for(i=0;i<arr.length;i++)s+=(arr[i]-m)*(arr[i]-m);return arr.length>1?Math.sqrt(s/(arr.length-1)):0;}
function tCritical(df){
var table={1:12.706,2:4.303,3:3.182,4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228,11:2.201,12:2.179,13:2.160,14:2.145,15:2.131,16:2.120,17:2.110,18:2.101,19:2.093,20:2.086,21:2.080,22:2.074,23:2.069,24:2.064,25:2.060,26:2.056,27:2.052,28:2.048,29:2.045,30:2.042};
if(df<1) return NaN;
if(table[df]) return table[df];
if(df>30) return 1.960;
return 2.5;
}
function pairedT(diffs){
var n=diffs.length, m=meanArr(diffs), s=sdArr(diffs), se=n?s/Math.sqrt(n):0;
var t = se? m/se : 0;
var df = n-1, crit = tCritical(df);
return {n:n, mean:m, sd:s, se:se, t:t, df:df, crit:crit, sig: n>1 && isFinite(crit) && Math.abs(t)>crit};
}
function respondentAgg(p){
var f=p.f, dAct=[],cAct=[],dCause=[],cCause=[],dTimeMs=0,cTimeMs=0,trapTotal=0,trapFollowed=0,i,row;
for(i=0;i<f.length;i++){
row=f[i];
if(row[2]==="D"){ dAct.push(row[5]); dCause.push(row[4]); dTimeMs+=row[3]; if(row[6]){trapTotal++; trapFollowed+=row[7];} }
else { cAct.push(row[5]); cCause.push(row[4]); cTimeMs+=row[3]; }
}
return {id:p.i, group:p.g, actD:meanArr(dAct), actC:meanArr(cAct), causeD:meanArr(dCause), causeC:meanArr(cCause), timeD:dTimeMs, timeC:cTimeMs, trapTotal:trapTotal, trapFollowed:trapFollowed};
}
function groupAnalyze(aggs){
if(aggs.length===0){ var z={mean:0,sd:0}; var zt=pairedT([]); return {n:0,actD:z,actC:z,causeD:z,causeC:z,timeD:z,timeC:z,actT:zt,causeT:zt,timeT:zt,trapTotal:0,trapFollowed:0,trapRate:0}; }
var actDs=aggs.map(function(a){return a.actD}), actCs=aggs.map(function(a){return a.actC});
var causeDs=aggs.map(function(a){return a.causeD}), causeCs=aggs.map(function(a){return a.causeC});
var timeDs=aggs.map(function(a){return a.timeD/60000}), timeCs=aggs.map(function(a){return a.timeC/60000});
var actDiff=aggs.map(function(a){return a.actD-a.actC});
var causeDiff=aggs.map(function(a){return a.causeD-a.causeC});
var timeDiff=aggs.map(function(a){return (a.timeD-a.timeC)/60000});
var trapTotal=0,trapFollowed=0;
aggs.forEach(function(a){trapTotal+=a.trapTotal;trapFollowed+=a.trapFollowed;});
return {
n:aggs.length,
actD:{mean:meanArr(actDs),sd:sdArr(actDs)}, actC:{mean:meanArr(actCs),sd:sdArr(actCs)},
causeD:{mean:meanArr(causeDs),sd:sdArr(causeDs)}, causeC:{mean:meanArr(causeCs),sd:sdArr(causeCs)},
timeD:{mean:meanArr(timeDs),sd:sdArr(timeDs)}, timeC:{mean:meanArr(timeCs),sd:sdArr(timeCs)},
actT:pairedT(actDiff), causeT:pairedT(causeDiff), timeT:pairedT(timeDiff),
trapTotal:trapTotal, trapFollowed:trapFollowed, trapRate: trapTotal? trapFollowed/trapTotal : 0
};
}

function verdictText(g){
function pctl(x){return (x*100).toFixed(0)+'%';}
var accDiffPts = (g.actD.mean - g.actC.mean)*100;
var timeDiffMin = g.timeC.mean - g.timeD.mean;
var accWinner = accDiffPts>0.5?'Б':(accDiffPts<-0.5?'А':null);
var timeWinner = timeDiffMin>0.05?'Б':(timeDiffMin<-0.05?'А':null);
var accSig = g.actT.sig, timeSig = g.timeT.sig;
var parts=[];
parts.push('<b>Точность действий:</b> Б — '+pctl(g.actD.mean)+', А — '+pctl(g.actC.mean)+' (разница '+(accDiffPts>=0?'+':'')+accDiffPts.toFixed(0)+' п.п., '+(accSig?'статистически значимо':'статистически незначимо')+').');
parts.push('<b>Время:</b> Б — '+g.timeD.mean.toFixed(1)+' мин, А — '+g.timeC.mean.toFixed(1)+' мин (Б '+(timeDiffMin>=0?'быстрее':'медленнее')+' на '+Math.abs(timeDiffMin).toFixed(1)+' мин, '+(timeSig?'статистически значимо':'статистически незначимо')+').');
var overall;
if(g.n<2){ overall='<b>Вывод:</b> данных меньше двух респондентов, статистический вывод делать рано.'; }
else if(accWinner==='Б' && timeWinner!=='А'){ overall='<b>Вывод: данные говорят в пользу интерфейса Б</b> — он не уступает в точности'+(timeWinner==='Б'?' и экономит время':'')+'.'; }
else if(accWinner==='А' && timeWinner!=='Б'){ overall='<b>Вывод: данные говорят в пользу интерфейса А.</b>'; }
else if(accWinner==='Б' && timeWinner==='А'){ overall='<b>Вывод:</b> Б точнее, А быстрее — выбор зависит от того, что важнее для задачи.'; }
else if(accWinner==='А' && timeWinner==='Б'){ overall='<b>Вывод:</b> Б быстрее, А точнее — выбор зависит от того, что важнее для задачи.'; }
else { overall='<b>Вывод:</b> различия пока не выражены, нужна бóльшая выборка.'; }
parts.push(overall);
return parts.join(' ');
}

'<h2>Анализ по группе респондентов</h2>'+
'<p class="muted">Вставьте коды результатов всех респондентов — каждый код на новой строке (их удобно скопировать из столбца с ответом на вопрос формы) — и нажмите «Проанализировать». Расчёт идёт локально в браузере.</p>'+
'<textarea id="anaIn" style="width:100%;min-height:140px;font-size:12px;font-family:monospace;padding:6px;border:1px solid #e2e8f0;border-radius:6px" placeholder="Один код на строку"></textarea>'+
'<div id="anaErr" style="color:var(--bad);font-size:13px;margin-top:6px"></div>'+
'<p><button class="pri" id="bAnaRun">Проанализировать</button> <button class="sec" id="bAnaBack">Назад</button></p>'+
'<div id="anaOut"></div>'+
'</div>';
$("bAnaBack").addEventListener("click", function(){ resumeItemTimer(); if(ST.stage==="intro"){ showIntro(); } else { render(); } });
$("bAnaRun").addEventListener("click", function(){
var raw = $("anaIn").value;
var lines = raw.split(/\r?\n/).map(function(x){return x.trim();}).filter(function(x){return x.length>0;});
var payloads=[], errors=[];
lines.forEach(function(line,idx){
try{ payloads.push(b64dec(line)); } catch(e){ errors.push("строка "+(idx+1)+": "+e.message); }
});
if(payloads.length===0){ $("anaErr").textContent = "Не удалось распознать ни одного кода. "+(errors[0]||""); $("anaOut").innerHTML=""; return; }
$("anaErr").textContent = errors.length? ("Распознано "+payloads.length+" из "+lines.length+". Не распознаны: "+errors.join("; ")) : "";
var aggs = payloads.map(respondentAgg);
var g = groupAnalyze(aggs);
var g0 = groupAnalyze(aggs.filter(function(a){return a.group===0;}));
var g1 = groupAnalyze(aggs.filter(function(a){return a.group===1;}));
function pct(x){ return (x*100).toFixed(0)+"%"; }
function fmtT(t){ return (t.n>1 && isFinite(t.t)) ? t.t.toFixed(2) : "—"; }
function sigWord(t){ return t.n<2 ? "мало данных" : (t.sig? "значимо (p<0.05)" : "незначимо"); }
var headline =
'<div class="report-head">'+
'<h3 style="margin-top:0">Итоговый отчёт: N = '+g.n+' участников</h3>'+
'<div class="big-stats">'+
'<div class="big-stat"><div class="big-num">'+pct(g.actD.mean)+'</div><div class="big-cap">точность действий, Вариант 1 (Б)</div></div>'+
'<div class="big-stat"><div class="big-num">'+pct(g.actC.mean)+'</div><div class="big-cap">точность действий, Вариант 2 (А)</div></div>'+
'<div class="big-stat"><div class="big-num">'+g.timeD.mean.toFixed(1)+' мин</div><div class="big-cap">среднее время, Вариант 1 (Б)</div></div>'+
'<div class="big-stat"><div class="big-num">'+g.timeC.mean.toFixed(1)+' мин</div><div class="big-cap">среднее время, Вариант 2 (А)</div></div>'+
'</div>'+
buildCompareBar('Доля верных действий', g.actD.mean, g.actC.mean, 1, pct)+
buildCompareBar('Доля верных причин', g.causeD.mean, g.causeC.mean, 1, pct)+
buildCompareBar('Среднее время, мин', g.timeD.mean, g.timeC.mean, Math.max(g.timeD.mean,g.timeC.mean,1), function(x){return x.toFixed(1)+' мин';})+
'<div class="verdict">'+verdictText(g)+'</div>'+
'</div>';
$("anaOut").innerHTML = headline +
'<h3>Подробная статистика</h3>'+
'<table><tr><th>Показатель</th><th>Вариант 1 (Б)</th><th>Вариант 2 (А)</th><th>Разница Б−А</th><th>t</th><th>df</th><th>Вывод</th></tr>'+
'<tr><td>Доля верных действий</td><td>'+pct(g.actD.mean)+' (SD '+pct(g.actD.sd)+')</td><td>'+pct(g.actC.mean)+' (SD '+pct(g.actC.sd)+')</td><td>'+pct(g.actT.mean)+'</td><td>'+fmtT(g.actT)+'</td><td>'+g.actT.df+'</td><td>'+sigWord(g.actT)+'</td></tr>'+
'<tr><td>Доля верных причин</td><td>'+pct(g.causeD.mean)+' (SD '+pct(g.causeD.sd)+')</td><td>'+pct(g.causeC.mean)+' (SD '+pct(g.causeC.sd)+')</td><td>'+pct(g.causeT.mean)+'</td><td>'+fmtT(g.causeT)+'</td><td>'+g.causeT.df+'</td><td>'+sigWord(g.causeT)+'</td></tr>'+
'<tr><td>Суммарное время, мин</td><td>'+g.timeD.mean.toFixed(1)+' (SD '+g.timeD.sd.toFixed(1)+')</td><td>'+g.timeC.mean.toFixed(1)+' (SD '+g.timeC.sd.toFixed(1)+')</td><td>'+g.timeT.mean.toFixed(1)+'</td><td>'+fmtT(g.timeT)+'</td><td>'+g.timeT.df+'</td><td>'+sigWord(g.timeT)+'</td></tr>'+
'</table>'+
'<p class="muted">t-критерий — парный, по разнице «Вариант 1 минус Вариант 2» внутри каждого респондента. Критическое значение взято из таблицы Стьюдента для df = N−1, α = 0.05, двустороннее; для df>30 используется приближение 1.96. Это предварительная оценка значимости, не заменяющая полный статистический пакет при публикации.</p>'+
'<p>Ловушечные ситуации в Варианте 1 (рекомендация системы была неверной): всего '+g.trapTotal+', принято без проверки '+g.trapFollowed+' раз ('+pct(g.trapRate)+').</p>'+
'<h3>Проверка по группам порядка (контроль эффекта очерёдности)</h3>'+
'<table><tr><th>Группа</th><th>N</th><th>Действие, Б</th><th>Действие, А</th><th>Причина, Б</th><th>Причина, А</th></tr>'+
'<tr><td>Группа 0</td><td>'+g0.n+'</td><td>'+pct(g0.actD.mean)+'</td><td>'+pct(g0.actC.mean)+'</td><td>'+pct(g0.causeD.mean)+'</td><td>'+pct(g0.causeC.mean)+'</td></tr>'+
'<tr><td>Группа 1</td><td>'+g1.n+'</td><td>'+pct(g1.actD.mean)+'</td><td>'+pct(g1.actC.mean)+'</td><td>'+pct(g1.causeD.mean)+'</td><td>'+pct(g1.causeC.mean)+'</td></tr>'+
'</table>'+
'<p class="muted">Если направление эффекта «Б лучше/хуже А» одинаковое в обеих группах, оно не объясняется порядком показа сценариев.</p>'+
'<p><button class="pri" id="bAnaCsvSum">Скачать сводный CSV (1 строка = 1 респондент)</button> '+
'<button class="sec" id="bAnaCsvLong">Скачать объединённый CSV (все наблюдения)</button></p>';
$("bAnaCsvSum").addEventListener("click", function(){ summaryCsv(aggs); });
$("bAnaCsvLong").addEventListener("click", function(){ longCsv(payloads); });
});
window.scrollTo(0,0);
}

var isAdmin = /admin=1/.test(location.search);
function showAdminButtons(){
$("bCsv").style.display="";
$("bDecode").style.display="";
$("bAnalyze").style.display="";
$("bAdminLogin").style.display="none";
}
if(!isAdmin){ $("bCsv").style.display="none"; $("bDecode").style.display="none"; $("bAnalyze").style.display="none"; } else { $("bAdminLogin").style.display="none"; }

$("bAdminLogin").addEventListener("click", function(){
var pass = prompt("Введите пароль администратора:");
if(pass===null) return;
if(pass==="12345"){ showAdminButtons(); } else { alert("Неверный пароль."); }
});

$("bCsv").addEventListener("click", csv);
$("bDecode").addEventListener("click", function(){ pauseItemTimer(); showDecoder(); });
$("bAnalyze").addEventListener("click", function(){ pauseItemTimer(); showAnalysis(); });
$("bReset").addEventListener("click", function(){
if(confirm("Начать заново? Текущий прогресс будет потерян.")){ resetAll(); }
});

document.addEventListener("visibilitychange", function(){
if(document.hidden){ pauseItemTimer(); } else { resumeItemTimer(); }
});

if(ST.stage==="intro"){ showIntro(); }
else {
if(ST.stage==="frame"){ var it0=ST.run[ST.step]; if(it0){ it0.last=Date.now(); save(); } }
render();
}

})();
</script>
</body>
</html>
